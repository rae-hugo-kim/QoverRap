[book]
title = "QoverwRap — 티켓 진위확인 데모 PRD"
authors = ["Sangrae Kim"]
language = "ko"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
smart-punctuation = true
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
